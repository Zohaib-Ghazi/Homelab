---
- name: Create a Jenkins user
  ansible.builtin.user:
    name: jenkins
    comment: "Jenkins Service User"
    shell: /bin/bash
    home: /home/jenkins
    createhome: no
  become: true
  register: jenkins_user_created
  
- name: Add s_admin user to jenkins group
  ansible.builtin.user:
    name: s_admin
    groups: jenkins
    append: yes
  become: true
  register: s_admin_in_jenkins_group

- name: Create the jenkins directory
  ansible.builtin.file:
    path: /opt/jenkins/data
    state: directory
    mode: 0770
    owner: jenkins
    group: jenkins
    recurse: yes
  become: true
  register: jenkins_data_dir_created
  
#TODO: Temporary until DNS server is configured on network
- name: If not present, add to /etc/hosts the static IP of RootCA VM
  lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    regexp: "^10.0.0.104"
    line: "10.0.0.104 PROD-Jenkins.naizoyden.net PROD-Jenkins"
    state: present
  become: true
  tags: network